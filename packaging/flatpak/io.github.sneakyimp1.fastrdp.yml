# Flatpak manifest for fastrdp.
#
# Local build:
#   flatpak install flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.sneakyimp1.fastrdp.yml
#   flatpak run io.github.sneakyimp1.fastrdp
#
# Keep the dependency versions in step with packaging/appimage/build-appimage.sh.
id: io.github.sneakyimp1.fastrdp
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: fastrdp

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # GPU for OpenGL and VAAPI decoding.
  - --device=dri
  # Smart card readers, through the host's pcscd.
  - --socket=pcsc
  # Saved passwords: Secret Service or KWallet.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Let the runtime pick the VAAPI driver; host overrides point at paths that don't exist here.
  - --unset-env=LIBVA_DRIVER_NAME
  - --unset-env=LIBVA_DRIVERS_PATH

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # The runtime's FFmpeg has no H.264 decoder, so ship a minimal one: H.264 with VAAPI
  # and DRM PRIME export, plus swscale for FreeRDP. LGPL, no external codec libraries.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-programs
      - --disable-doc
      - --disable-all
      - --enable-avcodec
      - --enable-swscale
      - --enable-decoder=h264
      - --enable-parser=h264
      - --enable-vaapi
      - --enable-libdrm
      - --enable-hwaccel=h264_vaapi
      - --disable-xlib
    cleanup:
      - /share/ffmpeg
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.3
        commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7

  # The runtime ships SDL 3.2; fastrdp is built and tested against 3.4.
  - name: SDL3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_TESTS=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_EXAMPLES=OFF
      - -DSDL_INSTALL_DOCS=OFF
      - -DSDL_RPATH=OFF
      - -DSDL_STATIC=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.4.16
        commit: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c

  # Needed for smart card sign-in (PKINIT); the runtime doesn't include it.
  - name: krb5
    buildsystem: autotools
    subdir: src
    config-opts:
      - --disable-static
    cleanup:
      - /bin
      - /sbin
      - /share/et
      - /share/examples
      - /var
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13

  # FreeRDP needs WITH_FFMPEG even though fastrdp decodes H.264 itself: without an
  # H.264 backend it never offers AVC420/AVC444 to the server.
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_CCACHE=OFF
      - -DWITH_CLANG_FORMAT=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_CLIENT=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_FFMPEG=ON
      - -DWITH_VIDEO_FFMPEG=ON
      - -DWITH_DSP_FFMPEG=OFF
      - -DWITH_SWSCALE=ON
      - -DWITH_OPENH264=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_JPEG=OFF
      - -DWITH_PULSE=ON
      - -DWITH_ALSA=OFF
      - -DWITH_OSS=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_PCSC=ON
      - -DWITH_PKCS11=ON
      - -DWITH_KRB5=ON
      - -DWITH_WEBVIEW=OFF
      - -DCHANNEL_URBDRC=OFF
      - -DCHANNEL_TSMF=OFF
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: 3.32.0
        commit: d27a4f7c1c63b62a5e60e5d939ad116cfb58ffc1

  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    cleanup:
      - /mkspecs
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09

  - name: fastrdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # The checkout this manifest lives in. For a Flathub submission, replace this with a
      # git source pinned to a release tag and commit.
      - type: dir
        path: ../..
        skip:
          - build
          - build-appimage
          - build-flatpak
          - .flatpak-builder
