# Builds the AppImage and the Flatpak bundle.
#
# Pushing a tag like v0.2.0 publishes both to a GitHub release. Running the workflow
# by hand (Actions → Release → Run workflow) only builds them and attaches them to the
# run as artifacts, which is handy for testing packaging changes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe needs the tags

      # FFmpeg, SDL3 and FreeRDP take most of the build time and only change when the
      # script does.
      - uses: actions/cache@v6
        with:
          path: build-appimage/prefix
          key: appimage-deps-${{ hashFiles('packaging/appimage/build-appimage.sh') }}

      - name: Build
        run: packaging/appimage/build-appimage.sh --install-deps

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: fastrdp-*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.sneakyimp1.fastrdp.yml
          bundle: fastrdp-x86_64.flatpak
          artifact-name: flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            fastrdp-*.AppImage
            fastrdp-*.flatpak
          generate_release_notes: true
          # v0.2.0-rc1 and similar are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
